        別府温泉の旅館を想定したLINE公式アカウント用リッチメニューです。

    予約導線を中心に、客室・温泉・食事・アクセスなど宿泊前に確認したい情報へスムーズにアクセスできる構成を目指しました。

        <li>予約ボタンを大きく配置し行動を促進</li>
        <li>食事や温泉など旅館の魅力を視覚的に伝えるレイアウトを採用</li>
